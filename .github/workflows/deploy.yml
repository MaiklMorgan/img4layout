name: Deploy to Hetzner

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build and deploy to Hetzner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.HETZNER_SSH_PORT }} ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts

      - name: Sync files to Hetzner server
        env:
          SSH_CMD: ssh -i ~/.ssh/id_rsa -p ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          rsync -az --delete \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude '*.log' \
            -e "${SSH_CMD} -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}:/var/www/img4layout.com/app

      - name: Install production dependencies and restart service
        run: |
          ssh -i ~/.ssh/id_rsa -p ${{ secrets.HETZNER_SSH_PORT }} -o StrictHostKeyChecking=no \
            ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} <<'EOF'
          set -euo pipefail
          cd /var/www/img4layout.com/app
          npm install --production
          systemctl restart img4layout
          EOF
